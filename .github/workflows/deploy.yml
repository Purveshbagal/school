name: Deploy School to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/school
            git remote set-url origin https://rushiravtale:${{ secrets.GIT_TOKEN }}@github.com/Purveshbagal/school.git
            git fetch origin
            git reset --hard origin/main
            cat > .env << 'EOF'
            DATABASE_URL="mongodb://127.0.0.1:27017/school-app?directConnection=true"
            NODE_ENV=production
            PORT=9696
            COOKIE_SECURE=false
            ADMIN_USERNAME=LittleStarSchool
            ADMIN_PASSWORD=Satwik@123
            EOF
            npm ci
            npx prisma db push
            rm -rf .next/
            npm run build
            pm2 restart school --update-env
            pm2 save
            echo "✅ School Deploy successful!"
